  <!-- ═══════════════════════════════════════════════════════════════
       STYLES
  ═══════════════════════════════════════════════════════════════ -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false });
    let num = 0;
    window.$docsify = {
      name: 'Best Practise',
      repo: 'beginwebdev2002/best-practise',
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 3,
      sidebarDisplayLevel: 1,
      autoHeader: true,
      auto2top: true,
      // SEO: update page <title> dynamically as user navigates
      formatUpdated: '{YYYY}/{MM}/{DD}',
      search: {
        maxSuggestions: 10,
        placeholder: 'Search Docs...',
        noData: 'No results found.',
        depth: 3,
      },
      homepage: './README.md',
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return (
                '<div class="mermaid">' + mermaid.render('mermaid-svg-' + num++, code) + "</div>"
              );
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      // Dynamic title & meta description per page
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            var title = vm.route.file
              ? document.title
              : 'Best Practise — Production-Ready Best Practices & Architecture Patterns';

            // Update OG/Twitter meta dynamically on navigation
            var ogTitle = document.querySelector('meta[property="og:title"]');
            var ogUrl   = document.querySelector('meta[property="og:url"]');
            var twTitle = document.querySelector('meta[name="twitter:title"]');
            var canonical = document.querySelector('link[rel="canonical"]');
            var currentUrl = window.location.href;

            if (ogTitle)   ogTitle.setAttribute('content', document.title);
            if (ogUrl)     ogUrl.setAttribute('content', currentUrl);
            if (twTitle)   twTitle.setAttribute('content', document.title);
            if (canonical) canonical.setAttribute('href', currentUrl);
          });
        }
      ]
    }
  </script>

  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
